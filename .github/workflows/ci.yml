name: CI Tests

on:
  push:
    branches:
      - main
  # Trigger on PRs (no forks)
  pull_request:
    branches:
      - main
  # Manual trigger
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or Ref to test'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || '' }}
          # Persist credentials is false to prevent the PR code from using the GITHUB_TOKEN
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.3.0
        with:
          go-version: '1.22'
      - name: Run Go tests
        working-directory: ./go
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: go test -timeout 20m ./...

  test-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || '' }}
          persist-credentials: false
      - name: Set up JDK 24
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.0
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven
      - name: Run Java tests
        working-directory: ./java
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: mvn -B test

  test-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || '' }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: javascript/package-lock.json
      - name: Install dependencies
        working-directory: ./javascript
        run: npm ci
      - name: Run JavaScript tests
        working-directory: ./javascript
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node --test *.test.js

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || '' }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ./python
        run: pip install absl-py google-genai Pillow pyink pytest
      - name: Run Python tests
        working-directory: ./python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Discover and run all .py files as tests
        run: python -m unittest discover -p "*.py"
